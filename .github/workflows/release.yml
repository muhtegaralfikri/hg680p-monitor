name: Build and Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Linux ARM64 binary
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-musl

      - name: Install musl tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build
        run: cargo build --release --target aarch64-unknown-linux-musl

      - name: Prepare artifact
        run: |
          mkdir -p dist
          cp target/aarch64-unknown-linux-musl/release/hg680p-monitor dist/hg680p-monitor
          chmod +x dist/hg680p-monitor
          cd dist
          sha256sum hg680p-monitor > hg680p-monitor.sha256

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: hg680p-monitor-linux-arm64
          path: dist/

      - name: Publish latest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git tag -f latest
          git push -f origin latest
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest dist/hg680p-monitor dist/hg680p-monitor.sha256 --clobber
            gh release edit latest --latest --title "Latest automated build" --notes "Automated ARM64 build from commit $GITHUB_SHA."
          else
            gh release create latest dist/hg680p-monitor dist/hg680p-monitor.sha256 --latest --title "Latest automated build" --notes "Automated ARM64 build from commit $GITHUB_SHA."
          fi
